<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#5e5ce6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="56" y="76" width="400" height="360" rx="44" fill="#ffffff"/>
  <!-- Barcode Bars -->
  <g fill="#000000">
    <!-- Left Guard -->
    <rect x="96" y="116" width="12" height="236" rx="2"/>
    <rect x="120" y="116" width="12" height="236" rx="2"/>
    <!-- Data Bars Left -->
    <rect x="148" y="116" width="24" height="204" rx="2"/>
    <rect x="184" y="116" width="12" height="204" rx="2"/>
    <rect x="212" y="116" width="20" height="204" rx="2"/>
    <!-- Center Guard -->
    <rect x="246" y="116" width="10" height="236" rx="2"/>
    <rect x="266" y="116" width="10" height="236" rx="2"/>
    <!-- Data Bars Right -->
    <rect x="292" y="116" width="28" height="204" rx="2"/>
    <rect x="332" y="116" width="12" height="204" rx="2"/>
    <rect x="356" y="116" width="18" height="204" rx="2"/>
    <!-- Right Guard -->
    <rect x="388" y="116" width="12" height="236" rx="2"/>
    <rect x="412" y="116" width="12" height="236" rx="2"/>
  </g>
  <!-- Laser / Vector Line -->
  <rect x="40" y="218" width="432" height="10" rx="5" fill="url(#accent)"/>
  <!-- CMYK K100 Dots -->
  <circle cx="164" cy="364" r="10" fill="#00aeef"/>
  <circle cx="196" cy="364" r="10" fill="#ec008c"/>
  <circle cx="228" cy="364" r="10" fill="#fff200" stroke="#d1d1d6" stroke-width="2"/>
  <circle cx="260" cy="364" r="10" fill="#000000"/>
  <text x="284" y="371" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="22" font-weight="800" fill="#1c1c1e" letter-spacing="1">K:100</text>
</svg>
